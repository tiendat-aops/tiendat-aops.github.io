  <path d="M297 208v18" stroke="#5b6470" stroke-width="2" marker-end="url(#a)"/>
  <rect x="124" y="232" width="346" height="60" rx="10" fill="#e4f1e4" stroke="#90bd90"/>
  <text x="297" y="257" font-size="19" font-weight="600" fill="#2f5e2f">Work-order ticket</text>
  <text x="297" y="279" font-size="16" fill="#5b6470">P0–P4 priority with SLAs</text>
