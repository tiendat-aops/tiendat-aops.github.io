<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" text-anchor="middle">
  <title>Schematic: sliding-window tiles, RF-DETR detection, DINOv2 and OCR, then per-class counts</title>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#5b6470"/></marker></defs>
  <rect width="480" height="300" fill="#fff"/>
  <rect x="24" y="20" width="140" height="140" fill="#f6f7f8" stroke="#9aa3ad" stroke-width="2"/>
  <path d="M71 20v140M117 20v140M24 67h140M24 113h140" stroke="#c8ced4" stroke-width="1.500" stroke-dasharray="5 4"/>
  <rect x="71" y="67" width="46" height="46" fill="#e3ebf7" stroke="#224b8d" stroke-width="2.500"/>
  <g fill="#7a8fb0"><circle cx="45" cy="42" r="5"/><rect x="134" y="36" width="10" height="10"/><circle cx="140" cy="136" r="5"/><rect x="42" y="130" width="10" height="10"/></g>
  <g fill="#d9822b"><circle cx="86" cy="82" r="5"/><rect x="96" y="92" width="10" height="10"/></g>
  <text x="94" y="186" font-size="17" font-weight="600" fill="#2f3437">Sliding-window tiles</text>
  <text x="94" y="244" font-size="34" font-weight="700" fill="#224b8d">98.7%</text>
  <text x="94" y="268" font-size="16" fill="#5b6470">symbol recall</text>
  <path d="M170 70h46" stroke="#5b6470" stroke-width="2" marker-end="url(#a)"/>
  <rect x="224" y="20" width="232" height="72" rx="10" fill="#e3ebf7" stroke="#8aa5d0"/>
  <text x="340" y="50" font-size="19" font-weight="600" fill="#224b8d">RF-DETR detection</text>
  <text x="340" y="74" font-size="16" fill="#5b6470">31 classes</text>
  <path d="M340 92v18" stroke="#5b6470" stroke-width="2" marker-end="url(#a)"/>
  <rect x="224" y="116" width="232" height="72" rx="10" fill="#f3efe2" stroke="#c9b98a"/>
  <text x="340" y="146" font-size="19" font-weight="600" fill="#2f3437">DINOv2 + OCR</text>
  <text x="340" y="170" font-size="16" fill="#5b6470">separate look-alike symbols</text>
  <path d="M340 188v18" stroke="#5b6470" stroke-width="2" marker-end="url(#a)"/>
  <rect x="224" y="212" width="232" height="72" rx="10" fill="#e4f1e4" stroke="#90bd90"/>
  <text x="340" y="242" font-size="19" font-weight="600" fill="#2f5e2f">Per-class counts</text>
  <text x="340" y="266" font-size="16" fill="#5b6470">annotated PDF, JSON, COCO</text>
</svg>
