<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" text-anchor="middle">
  <title>Schematic: an employee request goes to an LLM assistant that calls HR, calendar, and email tools</title>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#5b6470"/></marker></defs>
  <rect width="480" height="300" fill="#fff"/>
  <path d="M150 18h180a12 12 0 0 1 12 12v26a12 12 0 0 1-12 12H252l-12 12-12-12h-78a12 12 0 0 1-12-12V30a12 12 0 0 1 12-12Z" fill="#f6f7f8" stroke="#9aa3ad"/>
  <text x="240" y="50" font-size="19" font-weight="600" fill="#2f3437">Employee request</text>
  <path d="M240 82v16" stroke="#5b6470" stroke-width="2" marker-end="url(#a)"/>
  <rect x="80" y="104" width="320" height="74" rx="10" fill="#224b8d"/>
  <text x="240" y="135" font-size="21" font-weight="600" fill="#fff">LLM assistant</text>
  <text x="240" y="160" font-size="16" fill="#dbe5f5">multi-step tool calling</text>
  <path d="M240 178v14M88 192h304M88 192v22M240 192v22M392 192v22" fill="none" stroke="#5b6470" stroke-width="2"/>
  <g font-size="18" font-weight="600" fill="#2f3437">
    <rect x="24" y="214" width="128" height="46" rx="8" fill="#e3ebf7" stroke="#8aa5d0"/><text x="88" y="243">HR data</text>
    <rect x="176" y="214" width="128" height="46" rx="8" fill="#f3efe2" stroke="#c9b98a"/><text x="240" y="243">Calendar</text>
    <rect x="328" y="214" width="128" height="46" rx="8" fill="#e4f1e4" stroke="#90bd90"/><text x="392" y="243">Email</text>
  </g>
  <text x="240" y="287" font-size="17" fill="#5b6470">30+ typed tools, confirm before send</text>
</svg>
